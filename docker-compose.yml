version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=plants_user
      - DB_PASSWORD=secret
      - DB_NAME=plants_db
      - DB_SSLMODE=disable
    depends_on:
      - db

  db:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=plants_user
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=plants_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
